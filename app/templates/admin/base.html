<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin - Estúdio Souza{% endblock %}</title>
    <link href="/static/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/bootstrap-icons.css" rel="stylesheet">
    <link href="/static/css/admin.css" rel="stylesheet">
    {% block extra_css %}{% endblock %}
</head>
<body>
    {% block navbar %}
    <nav class="navbar navbar-expand-lg navbar-light beauty-admin-nav fixed-top">
        <div class="container-fluid">
            <button class="btn sidebar-toggle d-lg-none me-2" onclick="toggleSidebar()" aria-label="Menu">
                <i class="bi bi-list fs-5"></i>
            </button>
            <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="/admin/dashboard">
                <img src="/static/img/logo-ruth-souza.png" alt="Logo Ruth Souza" style="width:38px;height:38px;object-fit:cover;border-radius:50%;">
                Estúdio Souza <span class="badge bg-warning text-dark ms-2">Admin</span>
            </a>
            <div class="navbar-nav ms-auto">
                <div class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                        <i class="bi bi-person-circle me-1"></i>Admin
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" href="/admin/configuracoes"><i class="bi bi-gear me-2"></i>Configurações</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item text-danger" href="#" onclick="logout()"><i class="bi bi-box-arrow-right me-2"></i>Sair</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>
    {% endblock %}

    <!-- Overlay sidebar mobile -->
    <div class="sidebar-overlay" onclick="toggleSidebar()"></div>

    <div class="container-fluid admin-page-container">
        <div class="row">
            <!-- Sidebar -->
            <aside class="col-md-3 col-lg-2 px-0 sidebar">
                <nav class="nav flex-column">
                    <a class="nav-link {% if request.url.path == '/admin/dashboard' %}active{% endif %}" href="/admin/dashboard">
                        <i class="bi bi-speedometer2 me-2"></i>Dashboard
                    </a>
                    <a class="nav-link {% if request.url.path == '/admin/agendamentos' %}active{% endif %}" href="/admin/agendamentos">
                        <i class="bi bi-calendar-check me-2"></i>Agendamentos
                    </a>
                    <a class="nav-link {% if request.url.path == '/admin/clientes' %}active{% endif %}" href="/admin/clientes">
                        <i class="bi bi-people me-2"></i>Clientes
                    </a>
                    <a class="nav-link {% if request.url.path == '/admin/servicos' %}active{% endif %}" href="/admin/servicos">
                        <i class="bi bi-stars me-2"></i>Serviços
                    </a>
                    <a class="nav-link {% if request.url.path == '/admin/fidelidade' %}active{% endif %}" href="/admin/fidelidade">
                        <i class="bi bi-award me-2"></i>Fidelidade e Produtos
                    </a>
                    <a class="nav-link {% if request.url.path == '/admin/relatorios' %}active{% endif %}" href="/admin/relatorios">
                        <i class="bi bi-graph-up me-2"></i>Relatórios
                    </a>
                    <a class="nav-link {% if request.url.path == '/admin/configuracoes' %}active{% endif %}" href="/admin/configuracoes">
                        <i class="bi bi-gear me-2"></i>Configurações
                    </a>
                </nav>
            </aside>

            <!-- Main Content -->
            <main class="col-md-9 col-lg-10 px-4 main-content">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>

    <script src="/static/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/axios.min.js"></script>
    <script src="/static/js/chart.umd.min.js"></script>
    <script src="/static/js/admin.js"></script>
    {% block extra_js %}{% endblock %}

    <script>
    // Interceptar requisições para adicionar token
    axios.interceptors.request.use(config => {
        const token = localStorage.getItem('access_token');
        if (token) {
            config.headers.Authorization = `Bearer ${token}`;
        }
        return config;
    });

    // Tratar erros 401
    axios.interceptors.response.use(
        response => response,
        error => {
            if (error.response?.status === 401) {
                localStorage.removeItem('access_token');
                window.location.href = '/admin';
            }
            return Promise.reject(error);
        }
    );

    function logout() {
        localStorage.removeItem('access_token');
        window.location.href = '/admin';
    }

    // Verificar autenticação
    document.addEventListener('DOMContentLoaded', () => {
        const token = localStorage.getItem('access_token');
        if (!token && !window.location.pathname.includes('/admin') || window.location.pathname === '/admin') {
            // Permitir acesso à página de login
            return;
        }
        if (!token && window.location.pathname !== '/admin') {
            window.location.href = '/admin';
        }
    });

    function toggleSidebar() {
        document.querySelector('.sidebar').classList.toggle('show');
        document.querySelector('.sidebar-overlay').classList.toggle('show');
    }

    // Fechar sidebar ao clicar fora (mobile)
    document.addEventListener('click', (e) => {
        const sidebar = document.querySelector('.sidebar');
        const toggle = document.querySelector('.sidebar-toggle');
        const overlay = document.querySelector('.sidebar-overlay');
        if (window.innerWidth <= 768 && sidebar && toggle) {
            if (!sidebar.contains(e.target) && !toggle.contains(e.target) && !overlay.contains(e.target)) {
                sidebar.classList.remove('show');
                overlay.classList.remove('show');
            }
        }
    });
    </script>
</body>
</html>
