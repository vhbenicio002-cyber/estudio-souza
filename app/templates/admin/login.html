{% extends "base.html" %}

{% block title %}Acesso Administrativo - Estúdio Souza{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center align-items-center min-vh-100">
        <div class="col-md-5">
            <div class="card shadow">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <i class="bi bi-stars fs-1 text-warning mb-3"></i>
                        <h3 class="fw-bold">Área Administrativa</h3>
                        <p class="text-muted">Estúdio Souza</p>
                    </div>

                    <form id="form-login">
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" name="email" required autofocus>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Senha</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-warning fw-bold py-2" id="btn-login">
                                <i class="bi bi-box-arrow-in-right me-2"></i>Entrar
                            </button>
                        </div>
                    </form>

                    <div class="text-center mt-3 text-muted small">
                        <p>Entre com as credenciais administrativas configuradas na instalação.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.getElementById('form-login').addEventListener('submit', async (e) => {
    e.preventDefault();

    const btn = document.getElementById('btn-login');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Entrando...';

    const formData = new FormData(e.target);
    const data = new URLSearchParams();
    data.append('username', formData.get('email'));
    data.append('password', formData.get('password'));

    try {
        const resp = await axios.post('/auth/login', data, {
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
        });
        localStorage.setItem('access_token', resp.data.access_token);
        window.location.href = '/admin/dashboard';
    } catch (error) {
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-2"></i>Entrar';
        alert(error.response?.data?.detail || 'Erro ao fazer login');
    }
});
</script>
{% endblock %}
